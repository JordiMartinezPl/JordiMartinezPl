<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>CMDLE — guess the terminal command</title>
<style>
  :root {
    --bg: #05070a;
    --panel: #0b0f14;
    --fg: #2ecc71;
    --dim: #1c6b3f;
    --muted: #6b7280;
    --hit: #238636;
    --near: #b59f3b;
    --miss: #30363d;
    --key: #161b22;
    --border: #1f6f43;
    --mono: "SFMono-Regular", "Fira Code", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(120% 90% at 50% -10%, #0c1620 0%, var(--bg) 60%),
      var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    display: flex;
    justify-content: center;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .crt::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px);
    pointer-events: none;
    mix-blend-mode: multiply;
  }
  .wrap {
    width: 100%;
    max-width: 460px;
    padding: 18px 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header { text-align: center; }
  .prompt { color: var(--muted); font-size: 13px; letter-spacing: .5px; }
  h1 {
    margin: 2px 0 0;
    font-size: 30px;
    letter-spacing: 6px;
    text-shadow: 0 0 12px rgba(46,204,113,.45);
  }
  .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .msg {
    min-height: 20px;
    text-align: center;
    font-size: 13px;
    color: var(--fg);
    letter-spacing: .3px;
  }
  .board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    justify-content: center;
  }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tile {
    width: 54px; height: 54px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--miss);
    border-radius: 6px;
    font-size: 26px; font-weight: 700;
    text-transform: uppercase;
    color: #e6edf3;
    background: transparent;
    transition: transform .08s ease, background .2s ease, border-color .2s ease;
  }
  .tile.filled { border-color: var(--border); }
  .tile.pop { transform: scale(1.06); }
  .tile.hit  { background: var(--hit);  border-color: var(--hit);  color: #fff; }
  .tile.near { background: var(--near); border-color: var(--near); color: #111; }
  .tile.miss { background: var(--miss); border-color: var(--miss); color: #8b949e; }
  .keyboard { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
  .krow { display: flex; gap: 5px; justify-content: center; }
  .key {
    font-family: var(--mono);
    min-width: 30px; height: 46px;
    padding: 0 6px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--key);
    color: var(--fg);
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .key.wide { min-width: 52px; font-size: 11px; letter-spacing: .5px; }
  .key:active { transform: translateY(1px); }
  .key.hit  { background: var(--hit);  border-color: var(--hit);  color: #fff; }
  .key.near { background: var(--near); border-color: var(--near); color: #111; }
  .key.miss { background: #0a0d11; border-color: #21262d; color: #495059; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .stats { color: var(--muted); font-size: 12px; }
  .stats b { color: var(--fg); }
  .btn {
    font-family: var(--mono);
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 5px;
    padding: 7px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn:hover { background: rgba(46,204,113,.08); }
  .btn:disabled { opacity: .4; cursor: default; }
  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 6px; }
  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .cursor { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width: 380px) {
    .tile { width: 46px; height: 46px; font-size: 22px; }
    .key { min-width: 26px; height: 42px; }
  }
</style>
</head>
<body class="crt">
  <main class="wrap">
    <header>
      <div class="prompt">jordi@github:~$ ./cmdle<span class="cursor">_</span></div>
      <h1>CMDLE</h1>
      <div class="sub">guess the 5-letter terminal command</div>
    </header>

    <div class="msg" id="msg"></div>
    <section class="board" id="board" aria-label="game board"></section>

    <div class="bar">
      <div class="stats" id="stats"></div>
      <div style="display:flex; gap:6px;">
        <button class="btn" id="share" disabled>share</button>
        <button class="btn" id="practice">practice</button>
      </div>
    </div>

    <section class="keyboard" id="keyboard" aria-label="keyboard"></section>

    <footer>
      one puzzle a day &middot; <a href="https://github.com/JordiMartinezPl">back to profile</a>
    </footer>
  </main>

<script>
(() => {
  "use strict";

  const WORDS = [
    "CHMOD","CHOWN","CHGRP","MKDIR","RMDIR","TOUCH","SHRED","PASTE","SPLIT",
    "PATCH","XARGS","WATCH","SLEEP","UNZIP","MKNOD","MOUNT","FDISK","GDISK",
    "BLKID","LSBLK","BTRFS","PKILL","UNAME","WHICH","ALIAS","CLEAR","RESET",
    "FUSER","USERS","LOGIN","UMASK","CHAGE","NOHUP","DMESG","LSMOD","LSPCI",
    "LSUSB","NGINX","HTTPD","CROND","RSYNC","NMCLI","IPSET","ROUTE","WHOIS",
    "IFTOP","NLOAD","IPERF","CMAKE","CLANG","JAVAC","RUSTC","CARGO","BLACK",
    "ISORT","SWIFT","BABEL","RAILS","FLASK","SCONS","CTAGS","EMACS","CABAL",
    "STACK","NINJA","MYSQL","MONGO","VAULT","NOMAD","BYOBU","FALSE","UNSET",
    "LOCAL","SHIFT","BREAK","UNTIL"
  ];
  const WORD_LEN = 5, MAX = 6;
  const EPOCH = Date.UTC(2026, 0, 1);
  const DAY = 86400000;
  const KEY_STORE = "cmdle.v1";

  const todayIndex = () => {
    const now = new Date();
    const utc = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
    return Math.floor((utc - EPOCH) / DAY);
  };
  const dailyWord = () => WORDS[((todayIndex() % WORDS.length) + WORDS.length) % WORDS.length];

  // ---- feedback with correct duplicate handling ----
  function score(guess, answer) {
    const marks = Array(WORD_LEN).fill("miss");
    const rem = {};
    for (let i = 0; i < WORD_LEN; i++) {
      if (guess[i] === answer[i]) marks[i] = "hit";
      else rem[answer[i]] = (rem[answer[i]] || 0) + 1;
    }
    for (let i = 0; i < WORD_LEN; i++) {
      if (marks[i] === "hit") continue;
      const c = guess[i];
      if (rem[c] > 0) { marks[i] = "near"; rem[c]--; }
    }
    return marks;
  }

  // ---- persistence (daily save + streak) ----
  function loadStore() {
    try { return JSON.parse(localStorage.getItem(KEY_STORE)) || {}; }
    catch { return {}; }
  }
  function saveStore(s) {
    try { localStorage.setItem(KEY_STORE, JSON.stringify(s)); } catch {}
  }

  // ---- state ----
  let practiceMode = false;
  let answer = dailyWord();
  let guesses = [];      // committed guesses
  let current = "";      // in-progress row
  let status = "playing";
  let dayIdx = todayIndex();

  function restoreDaily() {
    const s = loadStore();
    if (s.day === dayIdx && s.answer === answer) {
      guesses = s.guesses || [];
      status = s.status || "playing";
    }
  }
  function persistDaily() {
    if (practiceMode) return;
    const s = loadStore();
    s.day = dayIdx; s.answer = answer; s.guesses = guesses; s.status = status;
    saveStore(s);
  }
  function bumpStreak(won) {
    const s = loadStore();
    s.played = (s.played || 0) + 1;
    if (won) {
      s.streak = (s.lastWinDay === dayIdx - 1) ? (s.streak || 0) + 1 : 1;
      s.best = Math.max(s.best || 0, s.streak);
      s.wins = (s.wins || 0) + 1;
      s.lastWinDay = dayIdx;
    } else {
      s.streak = 0;
    }
    saveStore(s);
  }

  // ---- DOM ----
  const boardEl = document.getElementById("board");
  const kbEl = document.getElementById("keyboard");
  const msgEl = document.getElementById("msg");
  const statsEl = document.getElementById("stats");
  const shareBtn = document.getElementById("share");
  const practiceBtn = document.getElementById("practice");

  const tiles = [];
  function buildBoard() {
    boardEl.innerHTML = "";
    tiles.length = 0;
    for (let r = 0; r < MAX; r++) {
      const row = document.createElement("div");
      row.className = "row";
      const rowTiles = [];
      for (let c = 0; c < WORD_LEN; c++) {
        const t = document.createElement("div");
        t.className = "tile";
        row.appendChild(t);
        rowTiles.push(t);
      }
      boardEl.appendChild(row);
      tiles.push(rowTiles);
    }
  }

  const KB = ["QWERTYUIOP", "ASDFGHJKL", "ENTER ZXCVBNM ⌫"];
  const keyEls = {};
  function buildKeyboard() {
    kbEl.innerHTML = "";
    KB.forEach(rowStr => {
      const row = document.createElement("div");
      row.className = "krow";
      rowStr.split(" ").forEach(tokenGroup => {
        // handle multi-char tokens (ENTER, ⌫) vs letter runs
        const tokens = (tokenGroup === "ENTER" || tokenGroup === "⌫")
          ? [tokenGroup] : tokenGroup.split("");
        tokens.forEach(k => {
          const b = document.createElement("button");
          b.className = "key" + (k.length > 1 ? " wide" : "");
          b.textContent = k === "⌫" ? "⌫" : k;
          b.dataset.key = k;
          b.addEventListener("click", () => handleKey(k));
          row.appendChild(b);
          if (k.length === 1) keyEls[k] = b;
        });
      });
      kbEl.appendChild(row);
    });
  }

  function paintCommittedRow(r) {
    const g = guesses[r];
    const marks = score(g, answer);
    for (let c = 0; c < WORD_LEN; c++) {
      const t = tiles[r][c];
      t.textContent = g[c];
      t.classList.add("filled", marks[c]);
    }
    // keyboard colors (best mark wins)
    const rank = { miss: 0, near: 1, hit: 2 };
    for (let c = 0; c < WORD_LEN; c++) {
      const el = keyEls[g[c]];
      if (!el) continue;
      const prev = el.dataset.mark;
      if (!prev || rank[marks[c]] > rank[prev]) {
        el.classList.remove("hit", "near", "miss");
        el.classList.add(marks[c]);
        el.dataset.mark = marks[c];
      }
    }
  }

  function renderCurrentRow() {
    const r = guesses.length;
    if (r >= MAX) return;
    for (let c = 0; c < WORD_LEN; c++) {
      const t = tiles[r][c];
      t.textContent = current[c] || "";
      t.classList.toggle("filled", c < current.length);
    }
  }

  function renderStats() {
    const s = loadStore();
    if (practiceMode) { statsEl.textContent = "practice mode"; return; }
    statsEl.innerHTML = `streak <b>${s.streak || 0}</b> &middot; best <b>${s.best || 0}</b> &middot; wins <b>${s.wins || 0}</b>`;
  }

  function setMsg(text) { msgEl.textContent = text || ""; }

  // ---- input ----
  function handleKey(k) {
    if (status !== "playing") return;
    if (k === "ENTER") return submit();
    if (k === "⌫" || k === "BACKSPACE") {
      current = current.slice(0, -1);
      renderCurrentRow();
      return;
    }
    if (/^[A-Z]$/.test(k) && current.length < WORD_LEN) {
      current += k;
      const t = tiles[guesses.length][current.length - 1];
      t.classList.add("pop");
      setTimeout(() => t.classList.remove("pop"), 90);
      renderCurrentRow();
      setMsg("");
    }
  }

  function submit() {
    if (current.length < WORD_LEN) { flashMsg("not enough letters"); return; }
    const r = guesses.length;
    guesses.push(current);
    current = "";
    paintCommittedRow(r);

    const solved = guesses[r] === answer;
    if (solved) {
      status = "won";
      finish(true, `solved in ${guesses.length}/${MAX} — it was ${answer.toLowerCase()}`);
    } else if (guesses.length >= MAX) {
      status = "lost";
      finish(false, `out of tries — it was ${answer.toLowerCase()}`);
    } else {
      renderCurrentRow();
    }
    persistDaily();
  }

  function finish(won, text) {
    setMsg(text);
    shareBtn.disabled = false;
    if (!practiceMode) bumpStreak(won);
    renderStats();
  }

  let flashTimer;
  function flashMsg(t) {
    setMsg(t);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { if (status === "playing") setMsg(""); }, 1400);
  }

  // ---- share ----
  function shareText() {
    const rows = guesses.map(g =>
      score(g, answer).map(m => m === "hit" ? "🟩" : m === "near" ? "🟨" : "⬛").join("")
    ).join("\n");
    const n = status === "won" ? guesses.length : "X";
    const tag = practiceMode ? "practice" : "#" + (dayIdx + 1);
    return `CMDLE ${tag} ${n}/${MAX}\n${rows}`;
  }
  shareBtn.addEventListener("click", async () => {
    const text = shareText();
    try { await navigator.clipboard.writeText(text); flashMsg("copied to clipboard"); }
    catch { flashMsg("copy failed"); }
  });

  // ---- practice ----
  practiceBtn.addEventListener("click", () => {
    practiceMode = true;
    answer = WORDS[Math.floor(Math.random() * WORDS.length)];
    guesses = []; current = ""; status = "playing";
    shareBtn.disabled = true;
    resetVisuals();
    setMsg("practice: a random command");
    renderStats();
  });

  function resetVisuals() {
    buildBoard();
    for (const k in keyEls) {
      keyEls[k].classList.remove("hit", "near", "miss");
      delete keyEls[k].dataset.mark;
    }
    renderCurrentRow();
  }

  // physical keyboard
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === "Enter") handleKey("ENTER");
    else if (k === "Backspace") handleKey("⌫");
    else if (/^[a-zA-Z]$/.test(k)) handleKey(k.toUpperCase());
  });

  // ---- boot ----
  buildBoard();
  buildKeyboard();
  restoreDaily();
  guesses.forEach((_, r) => paintCommittedRow(r));
  renderCurrentRow();
  renderStats();
  if (status !== "playing") {
    shareBtn.disabled = false;
    setMsg(status === "won"
      ? `already solved today — it was ${answer.toLowerCase()}`
      : `already played today — it was ${answer.toLowerCase()}`);
  } else if (guesses.length === 0) {
    setMsg("type a 5-letter command and hit enter");
  }
})();
</script>
</body>
</html>
